<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<!-- Template for keyframes.html, filled in by world-stories scripts/keyframes.py (step "page"). Do not edit the generated copy. -->
<style>
:root{--bg:#f5f8f7;--fg:#1c2928;--mut:#5b6e6b;--card:#fff;--line:#dce6e4;--brand:#2f7d73;--brand-soft:#e3f1ee;
  --like:#2f7d73;--no:#b4524a;--no-soft:#f8e7e5;--warn:#9a6a12;--warn-soft:#fbf1dc}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121818;--fg:#e5eeec;--mut:#9cb0ad;--card:#1b2423;
  --line:#2c3a39;--brand:#6cc3b6;--brand-soft:#1d3532;--like:#6cc3b6;--no:#e08a82;--no-soft:#3a2321;--warn:#e2b45a;--warn-soft:#3a3020}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,"Segoe UI",sans-serif}
main{max-width:1180px;margin:auto;padding:28px 16px 120px}
h1{margin:0 0 4px;font-size:26px}
.lead{color:var(--mut);margin:0 0 6px}
.ask{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:10px 14px;margin:16px 0 20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
article.like{border-color:var(--like);box-shadow:0 0 0 1px var(--like)}
article.no img{opacity:.45}
img,.ph{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--line)}
.ph{display:grid;place-items:center;color:var(--mut)}
.pad{padding:12px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
h2{font-size:17px;margin:0}
.m{color:var(--mut);font-size:13px;margin:0}
p{margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
.seg button:hover{border-color:var(--brand)}
.seg button[aria-pressed=true].yes{background:var(--brand-soft);border-color:var(--like);color:var(--like);font-weight:600}
.seg button[aria-pressed=true].nope{background:var(--no-soft);border-color:var(--no);color:var(--no);font-weight:600}
.seg button small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.sub{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.lbl{font-size:13px;font-weight:600;color:var(--mut)}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
select,input[type=text],textarea{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{width:100%;min-height:40px;resize:vertical}
.status{font-size:13px;border-radius:8px;padding:6px 10px}
.status.todo{background:var(--warn-soft);color:var(--warn)}
.status.ok{background:var(--brand-soft);color:var(--like)}
a.btn,button.btn{display:inline-block;text-decoration:none;border:1px solid var(--brand);color:var(--brand);background:transparent;border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
a.btn.primary,button.btn.primary{background:var(--brand);color:var(--card)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px}
.bar .in{max-width:1180px;margin:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.bar .sum{font-size:14px}
.bar .sum b{font-weight:600}
.bar .warn{color:var(--warn)}
.toast{font-size:13px;color:var(--like)}
/* long-take brief page */
.back{display:inline-block;margin:0 0 14px;color:var(--brand);text-decoration:none}
.long{display:grid;gap:20px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
@media (max-width:820px){.long{grid-template-columns:1fr}}
.long .pic{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.long form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field .hint{font-size:12px;color:var(--mut)}
.field textarea{min-height:70px}
.req{color:var(--no)}
.next{background:var(--brand-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.next ol{margin:4px 0 0;padding-left:20px}
/* short-footage page */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:17px;margin:0}
.shot{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px}
.shot .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.shot input[type=number]{width:64px}
.shot .x{margin-left:auto;border:0;background:transparent;color:var(--no);cursor:pointer;font:inherit;font-size:13px}
input[type=text].wide{width:100%}
textarea.prompt{min-height:260px;font:12px/1.5 ui-monospace,Consolas,monospace}
.banner{border-radius:8px;padding:8px 12px;font-size:14px}
.banner.run{background:var(--warn-soft);color:var(--warn)}
.banner.fail{background:var(--no-soft);color:var(--no)}
.banner.ok{background:var(--brand-soft);color:var(--like)}
pre.log{white-space:pre-wrap;font-size:12px;max-height:180px;overflow:auto;margin:6px 0 0}
.panel video{width:100%;border-radius:8px;background:#000}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.errs{color:var(--no);font-size:13px;margin:0;padding-left:18px}
.dirty{color:var(--warn);font-size:13px}
</style>
</head>
<body>
<main id="app"></main>
<div class="bar" id="bar" hidden><div class="in">
  <div class="sum" id="sum"></div>
  <div class="inline">
    <span class="toast" id="toast" role="status"></span>
    <button class="btn" type="button" id="dl">Download</button>
    <button class="btn primary" type="button" id="copy">Copy feedback</button>
  </div>
</div></div>
<script id="data" type="application/json">/*DATA*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'keyframe-decisions:' + D.out_dir;
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
// First visit in this browser: start from the choices already sent to the Agent (approval.json).
if (!Object.keys(S).length && D.approval) {
  for (const [id, v] of Object.entries(D.approval.keyframes || {}))
    S[id] = {like: v.like, mode: v.mode, duration: v.duration, long: v.long, note: v.note};
}
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const st = id => (S[id] = S[id] || {});
const kf = id => D.keyframes.find(x => x.id === id);
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} summary(); }
const longReady = d => d.long && d.long.topic && d.long.topic.trim();

/* ---------- short footage: script and prompt (same build as short_footage.py) ---------- */
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const dialogueOnly = audio => (String(audio || '').match(/\{[^}]*\}/g) || []).join(' ');
function buildPrompt(k, sc) {
  let body = `${D.canon.style}, ${D.format.ratio}, ${sc.duration}s.\n\n@image1 is the first frame of the video: ${sc.recap}. ` +
             `${D.canon.defs}\nSetting: ${k.setting}\n\n`;
  sc.shots.forEach(([a, b, act, au], i) => {
    const lines = dialogueOnly(au);
    body += `Shot ${i + 1} (${a}–${b}s): ${act}\n` + (lines ? `${lines}\n\n` : '\n');
  });
  return body + D.canon.rules + '\n';
}
function checkScript(sc) {
  const errs = [];
  let t = 0;
  if (!sc.shots.length) errs.push('add at least one shot');
  sc.shots.forEach(([a, b], i) => {
    if (a !== t) errs.push(`shot ${i + 1} starts at ${a}s but the previous one ends at ${t}s`);
    if (!(b > a)) errs.push(`shot ${i + 1} ends before it starts`);
    t = b;
  });
  if (sc.shots.length && t !== sc.duration) errs.push(`the shots end at ${t}s; the length is ${sc.duration}s`);
  if (sc.duration < D.format.min || sc.duration > D.format.max) errs.push(`the length must be ${D.format.min}–${D.format.max}s`);
  if (JSON.stringify(sc).includes('--')) errs.push('"--" cuts the prompt short; use a comma instead');
  return errs;
}
// The script and prompt shown: the user's edits if any, else the Agent's version from the task folder.
function shortNow(id) {
  const k = kf(id), d = st(id), sf = d.sf || {}, orig = k.short || {};
  const script = sf.script || orig.script || null;
  const prompt = sf.prompt ?? (script && sf.script ? buildPrompt(k, script) : orig.prompt);
  return {k, d, sf, orig, script, prompt};
}
function shortStatus(id) {
  const {k, sf, orig, script} = shortNow(id);
  if ((k.links || []).some(l => l.label.startsWith('Short'))) return ['ok', 'Video made'];
  if (sf.decision === 'generate') return ['ok', 'Marked: generate'];
  if (sf.decision === 'revise') return ['todo', 'Marked: needs changes'];
  if (sf.decision === 'draft') return ['todo', 'Marked: Agent drafts the script'];
  if (!script) return ['todo', 'No script yet'];
  return ['todo', (sf.script || sf.prompt) && !same(sf.script || orig.script, orig.script) ? 'Script edited, not yet confirmed' : 'Script ready for your review'];
}

/* ---------- keyframe list ---------- */
function card(k) {
  const d = st(k.id);
  const pic = k.img ? `<a href="${esc(k.img)}" target="_blank"><img src="${esc(k.img)}" alt="${esc(k.title)}"></a>`
                    : '<div class="ph">not rendered yet</div>';
  let sub = '';
  if (d.like === true) {
    let fmt = '';
    if (d.mode === 'short') {
      const defDur = D.format.options[Math.floor(D.format.options.length / 2)];
      const opts = D.format.options.map(s => `<option value="${s}" ${(d.duration || defDur) == s ? 'selected' : ''}>${s}s</option>`).join('');
      const [cls, txt] = shortStatus(k.id);
      fmt = `<div class="inline">Length <select data-act="dur">${opts}</select><span class="m">one Seedance clip from this keyframe</span></div>
        <div class="status ${cls}">${esc(txt)}</div>
        <div><a class="btn primary" href="#short/${esc(k.id)}">Script and video prompt →</a></div>`;
    } else if (d.mode === 'long') {
      fmt = longReady(d) || (d.long && d.long.include)
        ? `<div class="status ok">${d.long.topic ? 'Conversation topic: ' + esc(d.long.topic) : 'Lines to include given'} · ${d.long.minutes || 1} min</div>
           <div><a class="btn" href="#long/${esc(k.id)}">Edit the long-take brief</a></div>`
        : `<div class="status todo">Needs a conversation topic before the script and storyboard can be made.</div>
           <div><a class="btn primary" href="#long/${esc(k.id)}">Add conversation topic →</a></div>`;
    }
    sub = `<div class="sub"><span class="lbl">Make it into</span>
      <div class="seg">
        <button type="button" class="yes" data-act="mode" data-v="short" aria-pressed="${d.mode === 'short'}">Short footage<small>${D.format.min}–${D.format.max}s clip</small></button>
        <button type="button" class="yes" data-act="mode" data-v="long" aria-pressed="${d.mode === 'long'}">Long take<small>1–2 min, 3×3 storyboard first</small></button>
      </div>${fmt}</div>`;
  }
  const cls = d.like === true ? 'like' : d.like === false ? 'no' : '';
  return `<article class="${cls}" data-id="${esc(k.id)}">${pic}<div class="pad">
    <h2>${esc(k.id)} · ${esc(k.title)}</h2>
    <p class="m">${esc(k.location)} · ${esc(k.cast)} · ${esc(k.camera)}</p>
    <p>${esc(k.beat)}</p>
    ${(k.links || []).length ? `<div class="inline">${k.links.map(l => `<a class="btn" href="${esc(l.href)}">${esc(l.label)} →</a>`).join('')}</div>` : ''}
    <div class="seg">
      <button type="button" class="yes" data-act="like" data-v="1" aria-pressed="${d.like === true}">👍 Like</button>
      <button type="button" class="nope" data-act="like" data-v="0" aria-pressed="${d.like === false}">👎 Don't like</button>
    </div>${sub}
    <textarea data-act="note" placeholder="Changes or notes (optional), e.g. make ${esc(D.names[D.names.length - 1] || 'them')} sleepier">${esc(d.note)}</textarea>
  </div></article>`;
}

function list() {
  app.innerHTML = `<h1>${esc(D.title)}</h1><p class="lead"><b>Idea:</b> ${esc(D.idea)}</p>
    <div class="ask">Mark each keyframe 👍 or 👎. For a liked one, choose <b>short footage</b> (a ${D.format.min}–${D.format.max}s clip: adjust its
    script and video prompt, then mark it to generate) or a <b>long take</b> (1–2 min: give the conversation topic for its
    script and 3×3 storyboard). Everything is kept in this browser. When you are done, click <b>Copy feedback</b> and
    paste it to the Agent, who applies it and makes the next step.</div>
    <div class="grid">${D.keyframes.map(card).join('')}</div>`;
  summary();
}

app.addEventListener('click', ev => {
  const b = ev.target.closest('article button[data-act]');
  if (!b) return;
  const id = b.closest('article').dataset.id, d = st(id);
  if (b.dataset.act === 'like') {
    const v = b.dataset.v === '1';
    d.like = d.like === v ? undefined : v;          // click again to clear
  } else if (b.dataset.act === 'mode') {
    d.mode = d.mode === b.dataset.v ? undefined : b.dataset.v;
    if (d.mode === 'short' && !d.duration) d.duration = 15;
  }
  save();
  b.closest('article').outerHTML = card(kf(id));
});
app.addEventListener('input', ev => {
  const t = ev.target, art = t.closest('article');
  if (art && t.dataset.act === 'note') { st(art.dataset.id).note = t.value; save(); }
  if (art && t.dataset.act === 'dur') { st(art.dataset.id).duration = +t.value; save(); }
});

/* ---------- long-take brief page ---------- */
function longPage(id) {
  const k = kf(id);
  if (!k) { location.hash = ''; return; }
  const d = st(id);
  d.like = true; d.mode = 'long';
  const L = d.long = d.long || {minutes: 1};
  save();
  const pic = k.img ? `<img src="${esc(k.img)}" alt="${esc(k.title)}">` : '<div class="ph">not rendered yet</div>';
  app.innerHTML = `<a class="back" href="#">← All keyframes</a>
    <h1>Long take · ${esc(k.id)} · ${esc(k.title)}</h1>
    <p class="lead">A 1–2 min long take that starts from this keyframe and stays in one location
      (<b>${esc(k.location)}</b>). Give the conversation topic; the Agent writes the conversation script and draws a
      3×3 storyboard of the whole film for your review before any video is made.</p>
    <div class="long">
      <div class="pic">${pic}<div class="pad"><p class="m">${esc(k.cast)} · ${esc(k.camera)}</p><p>${esc(k.beat)}</p></div></div>
      <form id="brief" autocomplete="off">
        ${(k.links || []).filter(l => l.label.startsWith('Long')).map(l => `<div class="banner ok">The storyboard for this long take is ready: <a href="${esc(l.href)}">open it</a> to review and send feedback.</div>`).join('')}
        <div class="field"><label class="lbl" for="topic">Conversation topic <span class="req">*</span></label>
          <textarea id="topic" name="topic" placeholder="e.g. what the characters disagree about, and who wins">${esc(L.topic)}</textarea>
          <span class="hint">What ${esc(k.cast)} talk about. The script follows the voice rules in Identities.md.</span></div>
        <div class="field"><span class="lbl">Length</span>
          <div class="seg">
            <button type="button" class="yes" data-min="1" aria-pressed="${(L.minutes || 1) == 1}">1 minute<small>${Math.round(60 / D.format.segment)} segments × ${D.format.segment}s</small></button>
            <button type="button" class="yes" data-min="2" aria-pressed="${L.minutes == 2}">2 minutes<small>${Math.round(120 / D.format.segment)} segments × ${D.format.segment}s</small></button>
          </div></div>
        <div class="field"><label class="lbl" for="include">Lines, jokes or moments to include</label>
          <textarea id="include" name="include" placeholder="Optional. One per line, e.g. ${esc(D.names[0] || 'Name')}: &quot;a line you want&quot;">${esc(L.include)}</textarea></div>
        <div class="field"><label class="lbl" for="ending">Ending</label>
          <input type="text" id="ending" name="ending" value="${esc(L.ending)}" placeholder="Optional, e.g. everyone ends up laughing together">
          <span class="hint">The take stays in ${esc(k.location)}; an ending somewhere else becomes a separate clip.</span></div>
        <div class="field"><label class="lbl" for="notes">Other notes</label>
          <textarea id="notes" name="notes" placeholder="Optional: mood, pacing, anything to avoid">${esc(L.notes)}</textarea></div>
        <div class="next"><b>What happens next</b><ol>
          <li>Copy feedback and paste it to the Agent.</li>
          <li>The Agent writes the conversation script, draws the 3×3 storyboard and each segment's first frame →
            <code>storyboard.html</code> for your review.</li>
          <li>Videos are made only after you approve the storyboard.</li></ol></div>
        <div class="inline"><a class="btn" href="#">← Back to keyframes</a><span class="m" id="saved"></span></div>
      </form>
    </div>`;
  const f = document.getElementById('brief'), saved = document.getElementById('saved');
  f.addEventListener('input', ev => {
    if (ev.target.name) { L[ev.target.name] = ev.target.value; save(); saved.textContent = 'Kept in this browser'; }
  });
  f.addEventListener('click', ev => {
    const b = ev.target.closest('button[data-min]');
    if (!b) return;
    L.minutes = +b.dataset.min; save();
    f.querySelectorAll('button[data-min]').forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  window.scrollTo(0, 0);
}

/* ---------- short-footage page: adjust script and prompt, then mark to generate ---------- */
const toLines = audio => [...String(audio || '').matchAll(/\{([^:}]+):\s*"([^"]*)"\}/g)].map(m => `${m[1].trim()}: ${m[2]}`).join('\n');
const toAudio = text => text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
  const m = l.match(/^([^:]+):\s*(.+)$/);
  return m ? `{${m[1].trim()}: "${m[2].trim().replace(/"/g, '”')}"}` : null;
}).filter(Boolean).join(' ');

function shotHtml(sh, i) {
  const [a, b, act, au] = sh;
  return `<div class="shot" data-i="${i}">
    <div class="row2"><b>Shot ${i + 1}</b>
      <input type="number" min="0" max="${D.format.max}" step="1" data-f="a" value="${esc(a)}" aria-label="start"> –
      <input type="number" min="1" max="${D.format.max}" step="1" data-f="b" value="${esc(b)}" aria-label="end"> s
      <button type="button" class="x" data-del="${i}">Remove</button></div>
    <label class="lbl">Camera and action</label><textarea data-f="act">${esc(act)}</textarea>
    <label class="lbl">Dialogue, one line each: Speaker (tone): words</label><textarea data-f="au">${esc(toLines(au))}</textarea>
  </div>`;
}

function shortPage(id) {
  const k0 = kf(id);
  if (!k0) { location.hash = ''; return; }
  const d0 = st(id);
  d0.like = true; d0.mode = 'short'; d0.duration = d0.duration || 15;
  save();
  const pic = k0.img ? `<img src="${esc(k0.img)}" alt="${esc(k0.title)}">` : '<div class="ph">not rendered yet</div>';
  app.innerHTML = `<a class="back" href="#">← All keyframes</a>
    <h1>Short footage · ${esc(k0.id)} · ${esc(k0.title)}</h1>
    <p class="lead">A 10–20s clip that starts from this keyframe. Adjust the shots, dialogue or the video prompt here,
      mark it <b>Generate</b> or <b>Needs changes</b>, then <b>Copy feedback</b> and paste it to the Agent.
      Your edits are kept in this browser.</p>
    <div class="long">
      <div class="pic">${pic}<div class="pad"><p class="m">${esc(k0.location)} · ${esc(k0.cast)} · ${esc(k0.camera)}</p><p>${esc(k0.beat)}</p></div></div>
      <div class="panel" id="sf"></div>
    </div>`;
  window.scrollTo(0, 0);
  sfRender(id);
}

function sfRender(id) {
  const box = document.getElementById('sf');
  const {k, d, sf, orig, script, prompt} = shortNow(id);
  const video = (k.links || []).find(l => l.label.startsWith('Short'));
  const decide = `<h2>${script ? '4' : '2'} · Your decision</h2>
    <div class="seg">
      ${script ? `<button type="button" class="yes" data-dec="generate" aria-pressed="${sf.decision === 'generate'}">✓ Generate this video<small>paid render, made by the Agent</small></button>` : ''}
      <button type="button" class="yes" data-dec="${script ? 'revise' : 'draft'}" aria-pressed="${sf.decision === (script ? 'revise' : 'draft')}">${script ? '✎ Needs changes<small>the Agent revises it from your note</small>' : '✎ Draft the script for me<small>the Agent writes it from your ideas</small>'}</button>
    </div>
    <div class="field"><label class="lbl" for="sfNote">${script ? 'Note for the Agent' : 'Ideas for the conversation'} (optional)</label>
      <textarea id="sfNote" placeholder="${script ? 'e.g. make the joke land earlier' : 'e.g. what happens and who says what'}">${esc(sf.note)}</textarea></div>
    <p class="m">Then click <b>Copy feedback</b> (bottom bar) and paste it to the Agent.</p>`;

  if (!script) {
    box.innerHTML = `${video ? `<div class="banner ok">Video made: <a href="${esc(video.href)}">${esc(video.href)}</a></div>` : ''}
      <h2>1 · No script yet</h2>
      <p class="m">The Agent writes the timed shots and the conversation from this keyframe and the canon. Or write it yourself:</p>
      <div><button class="btn" type="button" id="own">Write the script myself</button></div>${decide}`;
    document.getElementById('own').onclick = () => {
      const dur = d.duration || 15, third = Math.round(dur / 3);
      sf.script = {title: k.title, duration: dur, recap: k.beat,
                   shots: [[0, third, '[MS, eye level, static] ', ''], [third, 2 * third, '[MCU, eye level, static] ', ''], [2 * third, dur, '[MS, eye level, static] ', '']]};
      d.sf = sf; save(); sfRender(id);
    };
    wireDecision(id, box);
    return;
  }

  const errs = checkScript(script);
  const editedScript = sf.script && !same(sf.script, orig.script);
  const handPrompt = sf.prompt !== undefined;
  const opts = D.format.options.map(v => `<option ${script.duration == v ? 'selected' : ''}>${v}</option>`).join('');
  box.innerHTML = `${video ? `<div class="banner ok">Video made: <a href="${esc(video.href)}">${esc(video.href)}</a></div><video controls src="${esc(video.href)}"></video>` : ''}
    <h2>1 · Script</h2>
    <p class="m">${editedScript ? '<b>Edited by you.</b> ' : 'The Agent\'s version. '}Changes are kept in this browser as you type.
      ${editedScript || handPrompt ? '<button class="btn" type="button" id="reset">Undo my edits</button>' : ''}</p>
    <div class="field"><label class="lbl" for="sTitle">Title</label><input type="text" class="wide" id="sTitle" value="${esc(script.title)}"></div>
    <div class="field"><label class="lbl" for="sRecap">Opens on (the first frame)</label><textarea id="sRecap">${esc(script.recap)}</textarea></div>
    <div class="inline">Length <select id="sDur">${opts}</select> s <span class="m">the shots must end exactly here</span></div>
    <div id="shots">${script.shots.map(shotHtml).join('')}</div>
    <div class="inline"><button class="btn" type="button" id="addShot">+ Add shot</button></div>
    <ul class="errs" id="errs">${errs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <h2>2 · Video prompt</h2>
    <p class="m" id="pnote">${handPrompt ? '<b>Edited by hand</b>: kept as you wrote it; script edits no longer change it.' : 'Built from the script and the canon (style, characters, voices, location, rules); it follows your script edits. You can also edit it directly.'}</p>
    <textarea class="prompt" id="prompt">${esc(prompt || '')}</textarea>
    ${handPrompt ? '<div><button class="btn" type="button" id="rebuild">Rebuild the prompt from the script</button></div>' : ''}
    <h2>3 · Check</h2>
    <p class="m">${errs.length ? 'Fix the script problems above before marking it to generate.' : 'Timing checks pass.'}</p>
    ${decide}`;

  const collect = () => ({
    title: document.getElementById('sTitle').value.trim(),
    duration: +document.getElementById('sDur').value,
    recap: document.getElementById('sRecap').value.trim(),
    shots: [...box.querySelectorAll('.shot')].map(el => [
      +el.querySelector('[data-f=a]').value, +el.querySelector('[data-f=b]').value,
      el.querySelector('[data-f=act]').value.trim(), toAudio(el.querySelector('[data-f=au]').value)])
  });
  const refresh = () => {   // after a script edit: keep it, re-check, rebuild the prompt unless edited by hand
    sf.script = collect(); d.sf = sf;
    if (sf.decision === 'generate' && checkScript(sf.script).length) sf.decision = undefined;
    save();
    const e = checkScript(sf.script);
    document.getElementById('errs').innerHTML = e.map(x => `<li>${esc(x)}</li>`).join('');
    if (sf.prompt === undefined) document.getElementById('prompt').value = buildPrompt(k, sf.script);
    const g = box.querySelector('[data-dec=generate]');
    if (g) { g.disabled = e.length > 0; g.setAttribute('aria-pressed', sf.decision === 'generate'); }
  };
  box.oninput = ev => {
    if (ev.target.id === 'sfNote') return;
    if (ev.target.id === 'prompt') { sf.prompt = ev.target.value; d.sf = sf; save(); document.getElementById('pnote').innerHTML = '<b>Edited by hand</b>: kept as you wrote it; script edits no longer change it.'; return; }
    refresh();
  };
  box.onchange = ev => { if (ev.target.id === 'sDur') refresh(); };
  box.onclick = ev => {
    const del = ev.target.closest('[data-del]');
    if (!del) return;
    const cur = collect(); cur.shots.splice(+del.dataset.del, 1);
    document.getElementById('shots').innerHTML = cur.shots.map(shotHtml).join(''); refresh();
  };
  document.getElementById('addShot').onclick = () => {
    const cur = collect(), last = cur.shots[cur.shots.length - 1];
    cur.shots.push([last ? last[1] : 0, cur.duration, '[MS, eye level, static] ', '']);
    document.getElementById('shots').innerHTML = cur.shots.map(shotHtml).join(''); refresh();
  };
  const reset = document.getElementById('reset');
  if (reset) reset.onclick = () => {
    if (!confirm('Undo all your edits to this script and prompt?')) return;
    delete sf.script; delete sf.prompt; d.sf = sf; save(); sfRender(id);
  };
  const rebuild = document.getElementById('rebuild');
  if (rebuild) rebuild.onclick = () => { delete sf.prompt; d.sf = sf; save(); sfRender(id); };
  const g = box.querySelector('[data-dec=generate]');
  if (g) g.disabled = errs.length > 0;
  wireDecision(id, box);
}

function wireDecision(id, box) {
  const d = st(id);
  box.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
    const sf = d.sf = d.sf || {};
    sf.decision = sf.decision === b.dataset.dec ? undefined : b.dataset.dec;
    save();
    box.querySelectorAll('[data-dec]').forEach(x => x.setAttribute('aria-pressed', x.dataset.dec === sf.decision));
  }));
  const note = box.querySelector('#sfNote');
  note.addEventListener('input', () => { (d.sf = d.sf || {}).note = note.value; save(); });
}

/* ---------- feedback, summary ---------- */
function feedback() {
  const out = {page: 'keyframes', idea: D.title, out_dir: D.out_dir, exported: new Date().toISOString(), keyframes: {}, undecided: []};
  for (const k of D.keyframes) {
    const d = S[k.id] || {};
    if (d.like === undefined) { out.undecided.push(k.id); continue; }
    const r = {title: k.title, like: d.like};
    if (d.like && d.mode) r.mode = d.mode;
    if (d.like && d.mode === 'short') {
      r.duration = d.duration || 15;
      const {sf, orig} = shortNow(k.id);
      const s = {};
      if (sf.decision) s.decision = sf.decision;
      if (sf.note && sf.note.trim()) s.note = sf.note.trim();
      if (sf.script && !same(sf.script, orig.script)) s.script = sf.script;
      if (sf.prompt !== undefined && sf.prompt !== orig.prompt) s.prompt = sf.prompt;
      if (Object.keys(s).length) r.short = s;
    }
    if (d.like && d.mode === 'long') {
      const L = d.long || {};
      r.long = {topic: (L.topic || '').trim(), minutes: L.minutes || 1, include: (L.include || '').trim(),
                ending: (L.ending || '').trim(), notes: (L.notes || '').trim()};
    }
    if (d.note && d.note.trim()) r.note = d.note.trim();
    out.keyframes[k.id] = r;
  }
  return out;
}
function summary() {
  const ks = D.keyframes.map(k => S[k.id] || {});
  const like = ks.filter(d => d.like === true), no = ks.filter(d => d.like === false).length;
  const short = like.filter(d => d.mode === 'short'), long = like.filter(d => d.mode === 'long');
  const gen = short.filter(d => d.sf && d.sf.decision === 'generate').length;
  const noMode = like.filter(d => !d.mode).length;
  const open = ks.length - like.length - no;
  let w = [];
  if (noMode) w.push(`${noMode} liked without a format`);
  document.getElementById('sum').innerHTML =
    `<b>${like.length}</b> liked (${short.length} short${gen ? `, ${gen} to generate` : ''}; ${long.length} long) · <b>${no}</b> not liked · <b>${open}</b> undecided` +
    (w.length ? ` · <span class="warn">${w.join(', ')}</span>` : '');
}
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; setTimeout(() => el.textContent = '', 3000); }
document.getElementById('copy').onclick = async () => {
  const txt = JSON.stringify(feedback(), null, 2);
  try { await navigator.clipboard.writeText(txt); toast('Copied: paste it to the Agent'); }
  catch (e) {
    const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); toast('Copied: paste it to the Agent'); } catch (e2) { toast('Copy failed: use Download'); }
    t.remove();
  }
};
document.getElementById('dl').onclick = () => {
  const blob = new Blob([JSON.stringify(feedback(), null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'feedback.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Downloaded feedback.json');
};

function route() {
  document.getElementById('bar').hidden = false;
  let m = location.hash.match(/^#long\/(\w+)$/);
  if (m) return longPage(m[1]);
  m = location.hash.match(/^#short\/(\w+)$/);
  if (m) return shortPage(m[1]);
  list();
}
window.addEventListener('hashchange', route);
route();
</script>
